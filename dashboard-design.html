<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiamFolio Dashboard Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3efe7;
  --panel: #fffdf8;
  --ink: #17130f;
  --muted: #837a70;
  --line: #e7ddcf;
  --line-strong: #dacbbb;
  --accent: #11100e;
  --shadow: 0 16px 40px rgba(65, 48, 31, .08);
  --radius: 18px;
  --ui: "IBM Plex Sans Thai", "Plus Jakarta Sans", sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--ui);
  background:
    linear-gradient(90deg, rgba(248, 243, 234, .88) 0%, rgba(248, 243, 234, .62) 48%, rgba(239, 232, 220, .38) 100%),
    linear-gradient(180deg, rgba(255, 253, 248, .34), rgba(228, 217, 200, .28)),
    url("assets/anime-maid-dashboard-bg.png") center / cover fixed no-repeat,
    linear-gradient(135deg, #f8f3ea 0%, var(--bg) 55%, #efe8dc 100%);
}
body:before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 24% 24%, rgba(255,255,255,.42), transparent 28%),
    radial-gradient(circle at 92% 12%, rgba(62, 86, 58, .18), transparent 30%),
    linear-gradient(180deg, transparent 0 62%, rgba(32, 24, 15, .08) 100%);
}
button, input { font: inherit; }
.shell {
  min-height: 100vh;
  display: block;
}
.status-dot {
  width: 7px;
  height: 7px;
  display: inline-block;
  border-radius: 999px;
  background: #42ad68;
  box-shadow: 0 0 0 5px rgba(66, 173, 104, .12);
}
.main {
  min-width: 0;
  padding: 22px 38px 46px;
}
.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
  align-items: center;
  margin-bottom: 28px;
}
.hello h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.18;
}
.hello p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 15px;
}
.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: 6px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.55);
  font-size: 13px;
}
.controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.toggle {
  display: flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
}
.toggle button {
  min-width: 72px;
  height: 42px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  font-weight: 800;
}
.toggle button.active {
  background: var(--accent);
  color: white;
}
.search {
  width: 274px;
  height: 52px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  padding: 0 18px;
  color: var(--ink);
}
.icon-btn, .add-btn {
  height: 52px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 16px;
  font-weight: 800;
  text-decoration: none;
}
.icon-btn {
  width: 52px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink);
}
.add-btn {
  padding: 0 22px;
  background: var(--accent);
  color: white;
}
.wire-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: 168px;
  gap: 16px;
  align-items: stretch;
}
.wire-card {
  position: relative;
  isolation: isolate;
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid rgba(218, 203, 187, .92);
  border-radius: var(--radius);
  background:
    linear-gradient(135deg, rgba(255,255,255,.82), rgba(255,253,248,.44)),
    radial-gradient(circle at 14% 18%, rgba(219, 163, 59, .22), transparent 28%),
    radial-gradient(circle at 86% 78%, rgba(43, 143, 138, .20), transparent 30%),
    var(--panel);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.75),
    0 16px 42px rgba(65, 48, 31, .10);
  text-decoration: none;
  cursor: pointer;
  transition: border-color .22s ease, transform .22s ease, box-shadow .22s ease, filter .22s ease;
}
.wire-card:before {
  content: "";
  position: absolute;
  inset: 10px;
  z-index: -1;
  border-radius: 14px;
  border: 1px solid rgba(17, 16, 14, .07);
  background:
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,.45) 50%, transparent 82%),
    repeating-linear-gradient(135deg, rgba(17,16,14,.035) 0 1px, transparent 1px 12px);
  opacity: .9;
}
.wire-card:after {
  content: "";
  position: absolute;
  width: 140px;
  height: 140px;
  right: -54px;
  top: -64px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(219,163,59,.45), rgba(43,143,138,.22));
  filter: blur(2px);
  opacity: .72;
  transition: transform .22s ease, opacity .22s ease;
}
.wire-title {
  position: relative;
  z-index: 1;
  display: block;
  color: var(--ink);
  font-family: "Plus Jakarta Sans", "IBM Plex Sans Thai", sans-serif;
  font-size: clamp(22px, 2.1vw, 34px);
  font-weight: 800;
  letter-spacing: .02em;
  text-align: center;
  text-shadow: 0 1px 0 rgba(255,255,255,.72);
}
.wire-subtitle {
  position: relative;
  z-index: 1;
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  text-align: center;
}
.wire-card:hover {
  border-color: rgba(219, 163, 59, .72);
  transform: translateY(-3px) scale(1.012);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.78),
    0 22px 58px rgba(65, 48, 31, .16);
}
.wire-card:hover:after {
  transform: translate(-10px, 12px) scale(1.08);
  opacity: .9;
}
.wire-card:active {
  transform: translateY(1px) scale(.985);
  filter: saturate(1.08);
  box-shadow:
    inset 0 2px 12px rgba(65, 48, 31, .10),
    0 8px 24px rgba(65, 48, 31, .12);
}
.wire-card:focus-visible {
  outline: 3px solid rgba(17, 16, 14, .22);
  outline-offset: 3px;
}
.loading-gate {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at 50% 42%, rgba(255,253,248,.86), rgba(248,243,234,.62) 42%, rgba(28,22,16,.22) 100%);
  opacity: 0;
  pointer-events: none;
  backdrop-filter: blur(0);
  transition: opacity .24s ease, backdrop-filter .24s ease;
}
.loading-gate.is-active {
  opacity: 1;
  pointer-events: auto;
  backdrop-filter: blur(8px);
}
.loading-panel {
  width: min(360px, 92vw);
  display: grid;
  justify-items: center;
  gap: 14px;
  padding: 24px;
  border: 1px solid rgba(218, 203, 187, .92);
  border-radius: 22px;
  background: rgba(255, 253, 248, .76);
  box-shadow: 0 26px 80px rgba(44, 33, 22, .22);
}
.mini-maid {
  width: 92px;
  height: 108px;
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,.78);
  background:
    url("assets/anime-maid-dashboard-bg.png") 78% 44% / 560px auto no-repeat;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.78),
    0 14px 28px rgba(54, 38, 24, .18);
  animation: maidBounce .9s ease-in-out infinite;
}
.loading-title {
  color: var(--ink);
  font-weight: 800;
  font-size: 20px;
}
.loading-subtitle {
  margin-top: -8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .08em;
}
.loading-bar {
  width: 100%;
  height: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(218, 203, 187, .62);
}
.loading-bar span {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #2b8f8a, #dba33b);
}
.loading-gate.is-active .loading-bar span {
  animation: loadingFill 3s linear forwards;
}
@keyframes maidBounce {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-8px) rotate(1deg); }
}
@keyframes loadingFill {
  to { width: 100%; }
}
.reveal {
  opacity: 0;
  transform: translateY(14px);
  animation: reveal .55s ease forwards;
}
@keyframes reveal {
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 1180px) {
  .wire-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 150px;
  }
}
@media (max-width: 760px) {
  .main { padding: 18px; }
  .topbar { grid-template-columns: 1fr; }
  .controls { flex-wrap: wrap; }
  .search { width: 100%; }
  .wire-grid {
    grid-template-columns: 1fr;
    grid-auto-rows: 156px;
  }
}
</style>
</head>
<body>
<div class="shell">
  <main class="main">
    <header class="topbar reveal">
      <div class="hello">
        <h1>สวัสดีค่ะ apisit tiakham</h1>
        <p>หน้าโครงดีไซน์ใหม่ <span class="live-pill"><span class="status-dot"></span> Blank layout</span></p>
      </div>
    </header>

    <section class="wire-grid" aria-label="โครงกรอบหน้า Dashboard">
      <a class="wire-card reveal" href="./index.html#dashboard" aria-label="ไปหน้า Dashboard เดิม">
        <span>
          <span class="wire-title">DCA-Portfolio</span>
          <span class="wire-subtitle">Open Dashboard</span>
        </span>
      </a>
    </section>
  </main>
</div>
<div class="loading-gate" id="loadingGate" aria-hidden="true">
  <div class="loading-panel" role="status" aria-live="polite">
    <div class="mini-maid" aria-hidden="true"></div>
    <div class="loading-title">กำลังเปิด DCA-Portfolio</div>
    <div class="loading-subtitle">PLEASE WAIT 3 SECONDS</div>
    <div class="loading-bar"><span></span></div>
  </div>
</div>
<script>
(() => {
  const gate = document.getElementById("loadingGate");
  const card = document.querySelector(".wire-card");
  if (!gate || !card) return;

  card.addEventListener("click", event => {
    const target = card.getAttribute("href");
    if (!target) return;
    event.preventDefault();
    gate.classList.add("is-active");
    gate.setAttribute("aria-hidden", "false");
    setTimeout(() => {
      location.href = target;
    }, 3000);
  });
})();
</script>
</body>
</html>
