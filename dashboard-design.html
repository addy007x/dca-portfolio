<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiamFolio Dashboard Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3efe7;
  --panel: #fffdf8;
  --ink: #17130f;
  --muted: #837a70;
  --line: #e7ddcf;
  --line-strong: #dacbbb;
  --accent: #11100e;
  --shadow: 0 16px 40px rgba(65, 48, 31, .08);
  --radius: 18px;
  --ui: "IBM Plex Sans Thai", "Plus Jakarta Sans", sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--ui);
  background: linear-gradient(135deg, #f8f3ea 0%, var(--bg) 55%, #efe8dc 100%);
}
button, input { font: inherit; }
.shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
}
.side {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 26px;
  padding: 30px 20px 24px;
  border-right: 1px solid var(--line);
  background: rgba(247, 241, 231, .78);
  backdrop-filter: blur(16px);
}
.brand, .profile {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand { padding: 0 14px; }
.brand-logo, .avatar {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: white;
  font-weight: 800;
  background:
    linear-gradient(145deg, rgba(255,255,255,.28), transparent 35%),
    linear-gradient(135deg, #2b8f8a, #e6a23a);
}
.brand b, .profile b { display: block; line-height: 1.1; }
.brand b { font-size: 22px; }
.brand span, .profile span { color: var(--muted); font-size: 13px; }
.menu-title {
  margin: 28px 14px 8px;
  color: #b0a79b;
  font-size: 12px;
  font-weight: 700;
}
.nav { display: grid; gap: 8px; }
.nav a {
  min-height: 54px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  border-radius: 16px;
  color: var(--ink);
  text-decoration: none;
  font-size: 17px;
  font-weight: 600;
}
.nav a.active {
  background: var(--panel);
  box-shadow: 0 10px 24px rgba(52, 39, 27, .08);
}
.nav i {
  width: 22px;
  color: #8b8176;
  font-style: normal;
  text-align: center;
}
.profile {
  margin-top: auto;
  padding: 18px;
  border-radius: 20px;
  background: rgba(255,255,255,.58);
}
.profile b { font-size: 16px; }
.status-dot {
  width: 7px;
  height: 7px;
  display: inline-block;
  border-radius: 999px;
  background: #42ad68;
  box-shadow: 0 0 0 5px rgba(66, 173, 104, .12);
}
.main {
  min-width: 0;
  padding: 22px 38px 46px;
}
.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
  align-items: center;
  margin-bottom: 28px;
}
.hello h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.18;
}
.hello p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 15px;
}
.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: 6px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.55);
  font-size: 13px;
}
.controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.toggle {
  display: flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
}
.toggle button {
  min-width: 72px;
  height: 42px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  font-weight: 800;
}
.toggle button.active {
  background: var(--accent);
  color: white;
}
.search {
  width: 274px;
  height: 52px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  padding: 0 18px;
  color: var(--ink);
}
.icon-btn, .add-btn {
  height: 52px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 16px;
  font-weight: 800;
  text-decoration: none;
}
.icon-btn {
  width: 52px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink);
}
.add-btn {
  padding: 0 22px;
  background: var(--accent);
  color: white;
}
.wire-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) repeat(2, minmax(180px, .475fr));
  grid-auto-rows: 122px;
  gap: 16px;
  align-items: stretch;
}
.wire-card {
  display: block;
  min-width: 0;
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
  text-decoration: none;
  cursor: pointer;
  transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.wire-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-2px);
  box-shadow: 0 20px 48px rgba(65, 48, 31, .12);
}
.wire-card:focus-visible {
  outline: 3px solid rgba(17, 16, 14, .22);
  outline-offset: 3px;
}
.wire-card:nth-child(1) {
  grid-column: 1 / 2;
  grid-row: span 2;
}
.wire-card:nth-child(6) {
  grid-column: 1 / 2;
  grid-row: span 2;
}
.wire-card:nth-child(7) {
  grid-column: 2 / 4;
  grid-row: span 2;
}
.wire-card:nth-child(9) {
  grid-column: span 2;
}
.reveal {
  opacity: 0;
  transform: translateY(14px);
  animation: reveal .55s ease forwards;
}
.wire-card:nth-child(2) { animation-delay: .03s; }
.wire-card:nth-child(3) { animation-delay: .06s; }
.wire-card:nth-child(4) { animation-delay: .09s; }
.wire-card:nth-child(5) { animation-delay: .12s; }
.wire-card:nth-child(6) { animation-delay: .15s; }
.wire-card:nth-child(7) { animation-delay: .18s; }
.wire-card:nth-child(8) { animation-delay: .21s; }
.wire-card:nth-child(9) { animation-delay: .24s; }
@keyframes reveal {
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 1180px) {
  .shell { grid-template-columns: 96px minmax(0, 1fr); }
  .side { padding: 24px 12px; }
  .brand div, .menu-title, .nav span, .profile div { display: none; }
  .nav a { justify-content: center; padding: 0; }
  .wire-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 150px;
  }
  .wire-card:nth-child(n) {
    grid-column: auto;
    grid-row: auto;
  }
  .wire-card:nth-child(1),
  .wire-card:nth-child(6),
  .wire-card:nth-child(7) {
    grid-column: 1 / -1;
    grid-row: span 2;
  }
}
@media (max-width: 760px) {
  .shell { display: block; }
  .side {
    position: static;
    height: auto;
    flex-direction: row;
    align-items: center;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .brand div, .nav span { display: none; }
  .nav { display: flex; }
  .profile { display: none; }
  .main { padding: 18px; }
  .topbar { grid-template-columns: 1fr; }
  .controls { flex-wrap: wrap; }
  .search { width: 100%; }
  .wire-grid {
    grid-template-columns: 1fr;
    grid-auto-rows: 156px;
  }
  .wire-card:nth-child(n) {
    grid-column: auto;
    grid-row: auto;
  }
  .wire-card:nth-child(1),
  .wire-card:nth-child(6),
  .wire-card:nth-child(7) {
    grid-row: span 2;
  }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-logo">SF</div>
      <div>
        <b>SiamFolio</b>
        <span>DCA Portfolio Tracker</span>
      </div>
    </div>

    <div>
      <div class="menu-title">เมนูหลัก</div>
      <nav class="nav">
        <a class="active" href="./index.html#dashboard"><i>⌂</i><span>หน้าแรก</span></a>
        <a href="./index.html#portfolio"><i>▣</i><span>พอร์ตการลงทุน</span></a>
        <a href="./index.html#dca"><i>▥</i><span>DCA Schedule</span></a>
        <a href="./index.html#earn"><i>◷</i><span>Earn</span></a>
        <a href="./index.html#history"><i>↺</i><span>ประวัติธุรกรรม</span></a>
        <a href="./index.html#tax"><i>▤</i><span>รายงานภาษี</span></a>
        <a href="./index.html#bench"><i>↗</i><span>เปรียบเทียบ</span></a>
      </nav>
    </div>

    <div class="profile">
      <div class="avatar">A</div>
      <div>
        <b>apisit tiakham</b>
        <span>สถานะ: <span class="status-dot"></span> ออนไลน์</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar reveal">
      <div class="hello">
        <h1>สวัสดีค่ะ apisit tiakham</h1>
        <p>หน้าโครงดีไซน์ใหม่ <span class="live-pill"><span class="status-dot"></span> Blank layout</span></p>
      </div>
      <div class="controls">
        <div class="toggle"><button class="active">฿ THB</button><button>$ USD</button></div>
        <input class="search" placeholder="ค้นหา ticker...">
        <a class="icon-btn" href="./index.html#settings" aria-label="ตั้งค่า">⚙</a>
        <a class="add-btn" href="./index.html#add-tx">+ เพิ่มธุรกรรม</a>
      </div>
    </header>

    <section class="wire-grid" aria-label="โครงกรอบหน้า Dashboard">
      <a class="wire-card reveal" href="./index.html#dashboard" aria-label="ไปหน้า Dashboard เดิม"></a>
      <a class="wire-card reveal" href="./index.html#portfolio" aria-label="ไปหน้าพอร์ตการลงทุนเดิม"></a>
      <a class="wire-card reveal" href="./index.html#dashboard" aria-label="ไปหน้ากำไรขาดทุนเดิม"></a>
      <a class="wire-card reveal" href="./index.html#dca" aria-label="ไปหน้า DCA เดิม"></a>
      <a class="wire-card reveal" href="./index.html#portfolio" aria-label="ไปหน้าจำนวนสินทรัพย์เดิม"></a>
      <a class="wire-card reveal" href="./index.html#dashboard" aria-label="ไปหน้ากราฟพอร์ตย้อนหลังเดิม"></a>
      <a class="wire-card reveal" href="./index.html#portfolio" aria-label="ไปหน้าการจัดสรรสินทรัพย์เดิม"></a>
      <a class="wire-card reveal" href="./index.html#earn" aria-label="ไปหน้า Earn เดิม"></a>
      <a class="wire-card reveal" href="./index.html#history" aria-label="ไปหน้าประวัติธุรกรรมเดิม"></a>
    </section>
  </main>
</div>
</body>
</html>
